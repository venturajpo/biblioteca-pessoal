server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Roteamento do lado do cliente: qualquer caminho desconhecido devolve o
    # index.html para que o Angular Router assuma a navegação.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Chamadas do front são encaminhadas à API pela rede interna do Compose.
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome podem ser cacheados indefinidamente.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }
}
