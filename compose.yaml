name: biblioteca-pessoal

services:
  db:
    image: mariadb:11.4
    container_name: biblioteca-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-biblioteca_pessoal}
      MARIADB_USER: ${DB_USER:-biblioteca}
      MARIADB_PASSWORD: ${DB_PASSWORD:-biblioteca}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - dados-mariadb:/var/lib/mysql
      # Scripts de init/ rodam na PRIMEIRA subida, enquanto o volume está vazio.
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biblioteca-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__BibliotecaPessoal: >-
        Server=db;Port=3306;Database=${DB_NAME:-biblioteca_pessoal};User Id=${DB_USER:-biblioteca};Password=${DB_PASSWORD:-biblioteca};
      # Origem liberada no CORS. Com o front atrás do nginx as chamadas são de
      # mesma origem; a entrada abaixo cobre o `ng serve` em desenvolvimento.
      Cors__OrigensPermitidas__0: ${WEB_ORIGIN:-http://localhost:4200}
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile
    container_name: biblioteca-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-4200}:80"

volumes:
  dados-mariadb:
