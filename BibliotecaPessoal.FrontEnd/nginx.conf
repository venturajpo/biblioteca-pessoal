server {
    listen 80;
    root /usr/share/nginx/html;
    # Com todas as rotas em RenderMode.Client, o build gera index.csr.html, e nao index.html.
    index index.csr.html;

    # Vazio, ou com auth_basic quando BASIC_AUTH_USER/BASIC_AUTH_PASSWORD estao definidos.
    include /etc/nginx/basic-auth.conf;

    # Mesmo papel do proxy.conf.json do ng serve: /api/... vai para o back sem o prefixo.
    # O endereco fica numa variavel com o DNS do Docker (127.0.0.11) para o nginx
    # resolver de novo quando o container do back for recriado e trocar de IP.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://bibliotecapessoal.backend:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
    }

    # Rotas do Angular (/livro/..., /adicionar) caem no index.
    location / {
        try_files $uri $uri/ /index.csr.html;
    }
}
